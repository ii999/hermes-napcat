# Merge into an existing Hermes config; preserve account, token, ACL and model settings.
# Explicit opt-ins: public outbound URLs, 10 MiB inline images and bounded image references.
gateway:
  platforms:
    napcat:
      extra:
        ws_max_bytes: 16777216
        media:
          inbound:
            mode: allowlist
          outbound:
            mode: public
          max_bytes: 10485760
          inline_max_bytes: 10485760
          references:
            enabled: true
            ttl_seconds: 1800
            max_entries: 1024
            attach_quoted: true
            attach_recent: false  # Enable for same-speaker recent images without an explicit quote.
            recent_seconds: 120
            recent_limit: 1
          # Optional: replace paths and mount the same storage into both processes.
          # outbound_roots: [/srv/qq-output]
          # shared_paths:
          #   - hermes: /srv/qq-shared
          #     napcat: /data/qq-shared
          # shared_cache_dir: /srv/qq-shared/staging
        # For untriggered group image references, also enable group_context observation.
        # group_context:
        #   enabled: true
        #   observe_untriggered: true
        #   observe_all_members: false
# This does not grant QQ tools or enable proactive participation.
