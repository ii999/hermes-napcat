# Merge into existing configuration; retain models, secrets and other platform settings.
# This Hermes setting applies to group sessions across platforms.
group_sessions_per_user: false
gateway:
  platforms:
    napcat:
      extra:
        # Replace the example group ID; retain any other allowed_groups entries.
        # Keep NAPCAT_ALLOW_ALL_USERS=false and NAPCAT_ALLOWED_USERS for private chats/admins.
        allowed_groups: ['987654321']
        group_allowed_chats: ['group:987654321']
        # Follow-up execution can use explicitly granted tools. Empty means no tools.
        # For read-only QQ tools use [napcat_qq_read] and qq_tools.read_enabled: true.
        group_toolsets: []
        group_context:
          enabled: true
          observe_untriggered: true
          # Observe all members; conversation authorization follows the group grants above.
          observe_all_members: true
          live_buffer_messages: 200
          history_limit: 50
          history_window_seconds: 1800
          max_context_chars: 12000
          history_backfill: true
          backfill_timeout_seconds: 3
          backfill_cooldown_seconds: 30
          stop_at_last_bot_message: false
        proactive_assist:
          # Recommended: continue invited conversations without unsolicited replies.
          enabled: false
          dry_run: false
          quiet_window_ms: 2200
          burst_window_seconds: 30
          cooldown_seconds: 120
          max_responses_per_hour: 4
          max_decisions_per_hour: 30
          confidence_threshold: 0.90
          ignored_users: []
          continuation:
            enabled: true
            idle_seconds: 120
            max_duration_seconds: 600
            max_responses_per_hour: 30
            max_decisions_per_hour: 120
          classifier:
            # Use the current Hermes profile model for tool-free admission, then run the Agent.
            # An independent classifier is optional.
            enabled: false
