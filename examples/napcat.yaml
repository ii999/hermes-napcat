# Flat extra configuration for `hermes-napcat --config ... check/probe`.
# Set NAPCAT_TOKEN and NAPCAT_ALLOWED_USERS in the environment.
self_id: '123456789'
mode: forward
ws_url: ws://127.0.0.1:3001
allow_insecure_ws: false
allowed_groups: ['987654321']
admins: ['111111111']  # Must also be in NAPCAT_ALLOWED_USERS.
group_mention: true
group_reply_to_bot: true
group_prefixes: ['/ai']
group_toolsets: []
media:
  enabled: true
  allowed_hosts:
    - multimedia.nt.qq.com
    - gchat.qpic.cn
    - c2cpicdw.qpic.cn
    - grouptalk.c2c.qq.com
  max_bytes: 10485760
  outbound_roots: []
  shared_paths: []
