name: Plugin tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest -q --junitxml=docs/junit-local.xml
      - run: uv run ruff check .
      - run: uv build
      - name: Retain test report and installable packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-${{ matrix.python }}
          path: |
            docs/junit-local.xml
            dist/
          retention-days: 7
