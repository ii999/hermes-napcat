[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-napcat-plugin"
version = "0.1.0"
description = "A native Hermes gateway plugin for NapCat / OneBot v11 over WebSocket"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "ii999"}]
dependencies = ["aiohttp>=3.12,<4", "pydantic>=2.9,<3", "PyYAML>=6,<7"]

[project.scripts]
hermes-napcat = "hermes_napcat.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
